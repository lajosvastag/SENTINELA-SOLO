; SENTINELA-SOLO — monitoramento de umidade, temperatura e condutividade do solo
; Autoria: Luís Brito | Copyright: Curié Edge
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
build_flags =
  -DCORE_DEBUG_LEVEL=0
